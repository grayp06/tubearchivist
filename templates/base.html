<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TubeArchivist Lite{% endblock %}</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b1120; color: #f3f4f6; }
    a { color: inherit; }
    header { position: sticky; top: 0; z-index: 10; background: rgba(11,17,32,.96); border-bottom: 1px solid #263247; backdrop-filter: blur(12px); }
    .topbar { width: min(1180px, calc(100% - 32px)); margin: auto; min-height: 68px; display: flex; align-items: center; gap: 32px; }
    .brand { font-size: 1.08rem; font-weight: 800; text-decoration: none; white-space: nowrap; }
    .brand span { color: #ef4444; }
    nav { display: flex; align-self: stretch; gap: 6px; overflow-x: auto; }
    nav a { display: grid; place-items: center; padding: 0 14px; color: #aeb8c8; text-decoration: none; border-bottom: 3px solid transparent; }
    nav a:hover, nav a.active { color: #fff; border-color: #ef4444; }
    main { width: min(1180px, calc(100% - 32px)); margin: 38px auto 72px; }
    .page-heading { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 26px; }
    h1 { margin: 0 0 6px; font-size: clamp(1.6rem, 4vw, 2.3rem); }
    h2 { margin: 32px 0 14px; }
    .muted { color: #9ca3af; }
    .button, button { display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; padding: 10px 15px; font: inherit; font-weight: 750; background: #ef4444; color: #fff; cursor: pointer; text-decoration: none; }
    .button.secondary, button.secondary { background: #293548; }
    .button.danger, button.danger { background: #7f1d1d; }
    .button.small, button.small { padding: 7px 10px; font-size: .83rem; }
    .empty, .panel { border: 1px solid #2b374b; background: #151e2e; border-radius: 12px; padding: 22px; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
    .video-card { min-width: 0; }
    .thumbnail { display: block; position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 10px; background: #1f2937; }
    .thumbnail img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .duration { position: absolute; right: 7px; bottom: 7px; padding: 3px 6px; border-radius: 4px; background: rgba(0,0,0,.82); font-size: .76rem; }
    .watched-badge { position: absolute; left: 7px; top: 7px; padding: 4px 7px; border-radius: 999px; background: rgba(5,150,105,.92); font-size: .72rem; font-weight: 800; }
    .video-title { display: block; margin: 11px 0 5px; font-weight: 750; line-height: 1.35; text-decoration: none; overflow-wrap: anywhere; }
    .video-title:hover { color: #fca5a5; }
    .video-meta { margin: 0; color: #9ca3af; font-size: .86rem; }
    .video-meta a { color: inherit; text-decoration: none; }
    .video-meta a:hover { color: #fff; text-decoration: underline; }
    .watch-progress-track { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(0,0,0,.45); }
    .watch-progress-bar { display: block; height: 100%; background: #ef4444; }
    .card-actions { display: flex; gap: 8px; margin-top: 10px; }
    .danger-action { margin-top: 12px; }
    .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .channel-card { display: flex; align-items: center; gap: 15px; border: 1px solid #2b374b; background: #151e2e; border-radius: 12px; padding: 18px; text-decoration: none; }
    .channel-card:hover { border-color: #ef4444; background: #192437; }
    .channel-avatar { width: 72px; height: 72px; flex: 0 0 72px; border-radius: 50%; object-fit: cover; background: #293548; display: grid; place-items: center; font-size: 1.6rem; font-weight: 800; }
    .channel-card h2 { margin: 0 0 6px; font-size: 1rem; overflow-wrap: anywhere; }
    .channel-card p { margin: 3px 0; font-size: .85rem; color: #9ca3af; }
    form.download-form { display: flex; gap: 10px; padding: 18px; border: 1px solid #2b374b; background: #151e2e; border-radius: 12px; }
    input[type=url] { flex: 1; min-width: 0; border: 1px solid #3b4960; border-radius: 8px; padding: 11px 12px; background: #0b1120; color: #fff; font: inherit; }
    .settings-form { display: grid; gap: 24px; max-width: 680px; }
    .settings-field { display: grid; gap: 7px; }
    .settings-field label { font-weight: 750; }
    .settings-field input, .settings-field select { width: 100%; border: 1px solid #3b4960; border-radius: 8px; padding: 11px 12px; background: #0b1120; color: #fff; font: inherit; }
    .settings-help { margin: 0; color: #9ca3af; font-size: .86rem; line-height: 1.5; }
    .notice, .error { margin: 14px 0; padding: 12px 14px; border-radius: 8px; }
    .notice { background: #12372d; color: #a7f3d0; }
    .error { background: #451a1a; color: #fecaca; }
    .download-list { display: grid; gap: 10px; }
    .download-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 20px; align-items: center; border: 1px solid #2b374b; background: #151e2e; border-radius: 10px; padding: 15px 17px; }
    .download-row strong { display: block; overflow-wrap: anywhere; }
    .download-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; color: #9ca3af; font-size: .83rem; margin-top: 5px; }
    .source-kind { color: #fca5a5; font-weight: 750; text-transform: capitalize; }
    .status { border-radius: 999px; padding: 5px 9px; font-size: .75rem; font-weight: 800; text-transform: uppercase; }
    .status.queued { background: #293548; color: #dbeafe; }
    .status.downloading { background: #1e3a5f; color: #bfdbfe; }
    .status.complete { background: #12372d; color: #a7f3d0; }
    .status.error { background: #451a1a; color: #fecaca; }
    .status.cancelled { background: #3f3f46; color: #e4e4e7; }
    .queue-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; }
    .queue-actions form { margin: 0; }
    progress { grid-column: 1 / -1; width: 100%; accent-color: #ef4444; }
    .player { width: 100%; max-height: 70vh; border-radius: 12px; background: #000; }
    .watch-layout { display: grid; gap: 18px; }
    code { color: #d1d5db; overflow-wrap: anywhere; }
    @media (max-width: 640px) {
      .topbar { gap: 12px; align-items: stretch; flex-direction: column; padding-top: 14px; }
      nav { min-height: 48px; }
      nav a { padding: 0 10px; }
      .page-heading { align-items: start; flex-direction: column; }
      form.download-form { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <a class="brand" href="{{ url_for('home_page') }}"><span>Tube</span>Archivist Lite</a>
      <nav aria-label="Primary navigation">
        <a href="{{ url_for('home_page') }}" {% if request.endpoint == 'home_page' %}class="active" aria-current="page"{% endif %}>Home</a>
        <a href="{{ url_for('channels_page') }}" {% if request.endpoint == 'channels_page' %}class="active" aria-current="page"{% endif %}>Channels</a>
        <a href="{{ url_for('downloads_page') }}" {% if request.endpoint in ('downloads_page', 'add_download_page') %}class="active" aria-current="page"{% endif %}>Downloads</a>
        <a href="{{ url_for('settings_page') }}" {% if request.endpoint in ('settings_page', 'update_settings_page') %}class="active" aria-current="page"{% endif %}>Settings</a>
      </nav>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
