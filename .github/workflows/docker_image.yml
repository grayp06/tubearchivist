name: docker_image

# publish the image to the GitHub container registry once the tests pass,
# so it can be pulled on devices that can not build it themselves

# build the image, run the unit tests inside of it
# and run the end to end tests against the running container,
# yt-dlp is replaced by a stand-in, nothing is requested from YouTube

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg INSTALL_DEBUG=1 -t tubearchivist:ci .

      - name: Run unit tests inside the image
        run: |
          docker run --rm \
            -e TA_CACHE_DIR=/tmp/cache \
            -e TA_MEDIA_DIR=/tmp/media \
            -e TA_AUTO_UPDATE_YTDLP=off \
            tubearchivist:ci \
            python -m pytest -q -k "not TomScottGo and not IBRACORP"

      - name: Start container
        run: |
          docker run -d --name tubearchivist \
            -p 8000:8000 \
            -e TA_HOST=http://localhost:8000 \
            -e TA_USERNAME=tubearchivist \
            -e TA_PASSWORD=verysecret \
            -e TA_AUTO_UPDATE_YTDLP=off \
            -e PYTHONPATH=/app/e2e/fake \
            tubearchivist:ci

      - name: Wait for the application
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/api/health/ > /dev/null; then
              echo "application is up"
              exit 0
            fi
            sleep 2
          done
          echo "application did not start"
          exit 1

      - name: Run end to end tests
        run: |
          docker exec \
            -e TA_E2E_URL=http://localhost:8000 \
            -e TA_E2E_USERNAME=tubearchivist \
            -e TA_E2E_PASSWORD=verysecret \
            -e TA_E2E_PIPELINE=1 \
            tubearchivist python /app/e2e/run.py

      - name: Stop container
        run: |
          docker stop -t 30 tubearchivist
          test "$(docker inspect -f '{{.State.ExitCode}}' tubearchivist)" = "0"

      - name: Container logs
        if: always()
        run: docker logs tubearchivist

  publish:
    # build for amd64 and arm64 and push to ghcr.io, not for pull requests
    needs: build-and-run
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
